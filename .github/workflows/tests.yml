name: retos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  probar-todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Resolver y verificar los 10 retos
        run: python herramientas/probar_todo.py
